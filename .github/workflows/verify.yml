name: Verify Korean edition
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install Pillow fonttools
      - run: python tools/check_korean.py
      - run: python tools/check_gen89.py
      - run: python tools/check_forms.py
      - run: python tools/gen_form_moves.py && git diff --exit-code -- form_moves_data.h
      - run: python tools/check_web.py
      - run: python tools/prepare_release_guides.py --out build/release-guides
      - run: node tools/tests/installer.test.cjs
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - run: python tools/build_emulator.py
      - run: python tools/unpack_sprites.py
      - name: Render collection lock screenshots
        run: |
          mkdir -p build/collection-screens
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy build/emulator/tamapoke-emu --shot collection-locks --out build/collection-screens/collection-locks.ppm
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy build/emulator/tamapoke-emu --shot detail --dex 955 --out build/collection-screens/locked-detail.ppm
          python -c "from PIL import Image; from pathlib import Path; [Image.open(p).save(p.with_suffix('.png')) for p in Path('build/collection-screens').glob('*.ppm')]"
      - uses: actions/upload-artifact@v4
        with:
          name: collection-screens
          path: build/collection-screens/*.png
      - run: python tools/test_runtime.py
      - run: python tools/test_android_lan_java.py
      - run: python tools/test_sd_store.py
      - uses: arduino/setup-arduino-cli@v2
      - run: arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - run: arduino-cli core install esp32:esp32@3.3.8 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - run: arduino-cli lib install "GFX Library for Arduino@1.6.7" "SensorLib@0.4.1" "XPowersLib@0.3.3"
      - run: python tools/build_firmware.py --out build/ci
